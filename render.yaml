services:
  - type: web
    name: agrisense-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: CORS_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false
